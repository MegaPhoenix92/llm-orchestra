version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: llm-orchestra-db
    environment:
      POSTGRES_USER: orchestra
      POSTGRES_PASSWORD: orchestra_dev
      POSTGRES_DB: llm_orchestra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestra -d llm_orchestra"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
